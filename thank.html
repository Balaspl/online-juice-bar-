<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Bala's Juice & Snacks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-image: url('https://img.freepik.com/premium-photo/assortment-fresh-fruits-vegetables_118124-196761.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .overlay {
            min-height: 100vh;
            background-color: rgba(0, 0, 0, 0.70);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            color: gold;
            font-size: clamp(28px, 5vw, 52px);
            margin-bottom: 16px;
        }

        hr {
            border: 1px solid gold;
            width: 60%;
            margin-bottom: 30px;
        }

        .info p, .info h5 {
            color: gold;
            font-size: clamp(14px, 2.5vw, 18px);
            margin-bottom: 12px;
            font-weight: normal;
        }

        .home-btn {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            color: rgb(156, 16, 16);
            background-color: gold;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
        }

        .home-btn:hover {
            background-color: #e6c200;
        }
    </style>
</head>

<body>
    <div class="overlay">
        <h1>Thank You For Your Order!</h1>
        <hr>
        <div class="info">
            <p>Your order will arrive soon! &mdash; Expected time: 20 minutes</p>
            <h5>Contact: +91 9751817153 &mdash; Email: info@balasjuicesnacks.com</h5>
            <p>&copy; 2026 Bala's Juice and Snacks. All rights reserved.</p>
        </div>
        <a href="index.html" class="home-btn">Go to Home Page</a>
    </div>
</body>

</html>
