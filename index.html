<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        WeatherApp Bala
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="sunny">

    <!-- Animation Layer -->

    <div
        id="animation-container"
    ></div>

    <!-- Main App -->

    <div class="app">

        <!-- Header -->

        <div class="header">

            <h1>

                🌦 WeatherApp

            </h1>

            <p>

                Live Weather & Forecast

            </p>

        </div>

        <!-- Search -->

        <div class="search-section">

            <input
                type="text"
                id="city"
                placeholder="Enter City Name..."
            >

            <button
                id="searchBtn"
            >

                Search

            </button>

        </div>

        <!-- Error -->

        <div
            id="error"
        ></div>

        <!-- Current Weather -->

        <div
            id="weather-card"
            class="weather-card"
        >

            <div
                id="weather"
            >

            </div>

        </div>

        <!-- Forecast -->

        <div
            class="forecast-section"
        >

            <h2>

                5 Day Forecast

            </h2>

            <div
                id="forecast"
            >

            </div>

        </div>

    </div>

    <script
        src="script.js"
    ></script>

</body>

</html>
